        minMedia: 0,

        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80',

    };

    const EMOJI_LIST = ['🔥', '🚀', '💡', '✨', '📈', '💬', '🎉', '📌', '🤖', '❤️', '🙌', '🌟', '🎯', '⚡', '💻', '🎨'];
    const TRENDING_HASHTAGS = ['#tech', '#ai', '#innovation', '#marketing', '#buildinpublic', '#reactjs', '#dev', '#design', '#growth', '#productivity', '#future'];

    // Helper functions
    function extractHashtags(text) {
      if (!text) return [];
      const matches = text.match(/#[\w\u0590-\u05ff]+/g);
      if (!matches) return [];
      return Array.from(new Set(matches));
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
      });
    }

    function validatePlatform(platform, text = '', mediaFiles = []) {
      const errors = [];
      const warnings = [];
      const charCount = text.length;
      const mediaCount = mediaFiles.length;
      const hashtags = extractHashtags(text);
      const hashtagCount = hashtags.length;

      if (charCount > platform.maxChars) {
        errors.push(`Exceeds maximum limit (${charCount}/${platform.maxChars} chars)`);
      }
      if (platform.minMedia > 0 && mediaCount < platform.minMedia) {
        errors.push(`${platform.name} requires at least ${platform.minMedia} photo/video`);
      }
      if (mediaCount > platform.maxMedia) {
        errors.push(`Exceeds maximum media (${mediaCount}/${platform.maxMedia})`);
      }
      if (hashtagCount > platform.maxHashtags) {
        errors.push(`Exceeds hashtag limit (${hashtagCount}/${platform.maxHashtags})`);
      }
      if (platform.id === 'facebook' && charCount > 0 && charCount < 50) {
        warnings.push(`Recommended >100 characters for engagement`);
      }

      const percentage = Math.min(100, Math.round((charCount / platform.maxChars) * 100));

      let ringStatusClass = 'text-emerald-500';
      let ringBgClass = 'stroke-emerald-500';
      if (percentage >= 90 && percentage < 100) {
        ringBgClass = 'stroke-amber-500';
      } else if (percentage >= 100 || errors.length > 0) {
        ringBgClass = 'stroke-rose-500';
      }

      return {
        isValid: errors.length === 0,
        errors,
        warnings,
        charCount,
        mediaCount,
        hashtagCount,
        percentage,
        remainingChars: platform.maxChars - charCount,
        ringBgClass
      };
    }

    function calculateSvgRing(percentage, radius = 18) {
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (percentage / 100) * circumference;
      return { circumference, strokeDashoffset: Math.max(0, strokeDashoffset) };
    }

    function formatDate(dateInput) {
      if (!dateInput) return 'Just now';
      const d = new Date(dateInput);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatName(nameStr) {
      if (!nameStr) return 'Creator';
      const cleaned = nameStr.replace(/[._-]/g, ' ');
      return cleaned
        .split(' ')
        .filter(Boolean)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    const storage = {
      getUser: () => {
        try {
          const d = localStorage.getItem('postforge_user');
          return d ? JSON.parse(d) : null;
        } catch(e) { return null; }
      },
      setUser: (user) => {
        try {
          if (user) localStorage.setItem('postforge_user', JSON.stringify(user));
          else localStorage.removeItem('postforge_user');
        } catch(e) {}
      },
      getDrafts: (email) => {
        if (!email) return [];
        try {
          const all = JSON.parse(localStorage.getItem('postforge_drafts') || '[]');
          return all.filter(d => d.userEmail === email);
        } catch(e) { return []; }
      },
      saveDraft: (draft) => {
        try {
          const all = JSON.parse(localStorage.getItem('postforge_drafts') || '[]');
          const idx = all.findIndex(d => d.id === draft.id);
          if (idx >= 0) all[idx] = { ...all[idx], ...draft, updatedAt: new Date().toISOString() };
          else all.unshift({ ...draft, id: draft.id || `draft_${Date.now()}`, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
          localStorage.setItem('postforge_drafts', JSON.stringify(all));
          return all.filter(d => d.userEmail === draft.userEmail);
        } catch(e) { return []; }
      },
      deleteDraft: (id, email) => {
        try {
          let all = JSON.parse(localStorage.getItem('postforge_drafts') || '[]');
          all = all.filter(d => String(d.id) !== String(id));
          localStorage.setItem('postforge_drafts', JSON.stringify(all));
          return all.filter(d => d.userEmail === email);
        } catch(e) { return []; }
      }
    };

    // Main React Application
    function App() {
      const [currentUser, setCurrentUser] = React.useState(() => storage.getUser());
      const [postContent, setPostContent] = React.useState('');
      const [postTitle, setPostTitle] = React.useState('');
      const [selectedPlatforms, setSelectedPlatforms] = React.useState(['twitter', 'instagram', 'linkedin', 'facebook']);
      const [activePreviewTab, setActivePreviewTab] = React.useState('twitter');
      const [uploadedMedia, setUploadedMedia] = React.useState([]);
      const [drafts, setDrafts] = React.useState([]);
      const [activeStudioTab, setActiveStudioTab] = React.useState('drafts');
      const [editingDraftId, setEditingDraftId] = React.useState(null);

      // Auth Modal State
      const [authModalOpen, setAuthModalOpen] = React.useState(false);
      const [authMode, setAuthMode] = React.useState('login');
      const [authEmail, setAuthEmail] = React.useState('');
      const [authPassword, setAuthPassword] = React.useState('');
      const [authName, setAuthName] = React.useState('');
      const [authError, setAuthError] = React.useState('');
      const [authLoading, setAuthLoading] = React.useState(false);
      const [mongoConnected, setMongoConnected] = React.useState(true);

      const [toast, setToast] = React.useState(null);
      const textareaRef = React.useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      React.useEffect(() => {
        if (currentUser) fetchUserDrafts(currentUser.email);
        else setDrafts([]);
      }, [currentUser]);

      React.useEffect(() => {
        fetch('/api/health')
          .then(r => r.json())
          .then(d => setMongoConnected(d.mongoConnected ?? true))
          .catch(() => setMongoConnected(false));
      }, []);

      const fetchUserDrafts = async (email) => {
        try {
          const res = await fetch(`/api/drafts?email=${encodeURIComponent(email)}`);
          if (res.ok) {
            const data = await res.json();
            setDrafts(data.drafts || []);
            return;
          }
        } catch(e) {}
        setDrafts(storage.getDrafts(email));
      };

      const togglePlatform = (id) => {
        if (selectedPlatforms.includes(id)) {
          if (selectedPlatforms.length > 1) {
            const rem = selectedPlatforms.filter(p => p !== id);
            setSelectedPlatforms(rem);
            if (activePreviewTab === id) setActivePreviewTab(rem[0]);
          } else {
            showToast('Select at least 1 target platform', 'warning');
          }
        } else {
          setSelectedPlatforms([...selectedPlatforms, id]);
          setActivePreviewTab(id);
        }
      };

      const validations = React.useMemo(() => {
        const res = {};
        Object.keys(PLATFORMS).forEach(k => {
          res[k] = validatePlatform(PLATFORMS[k], postContent, uploadedMedia);
        });
        return res;
      }, [postContent, uploadedMedia]);

      const isPostValid = React.useMemo(() => {
        return selectedPlatforms.every(p => validations[p]?.isValid);
      }, [selectedPlatforms, validations]);

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        for (const file of files) {
          if (uploadedMedia.length >= 10) {
            showToast('Max 10 media files allowed', 'warning');
            break;
          }
          try {
            const b64 = await fileToBase64(file);
            const isPdf = file.type === 'application/pdf' || file.name.endsWith('.pdf');
            const isVid = file.type.startsWith('video/');
            setUploadedMedia(prev => [
              ...prev,
              {
                id: `m_${Date.now()}_${Math.random().toString(36).substr(2,4)}`,
                name: file.name,
                type: isPdf ? 'pdf' : (isVid ? 'video' : 'image'),
                url: b64,
                size: (file.size / (1024*1024)).toFixed(2) + ' MB'
              }
            ]);
          } catch(err) {
            showToast(`Failed to load ${file.name}`, 'error');
          }
        }
        e.target.value = '';
      };

      const removeMedia = (id) => {
        setUploadedMedia(uploadedMedia.filter(m => m.id !== id));
      };

      const insertEmoji = (emoji) => {
        setPostContent(prev => prev + emoji);
        if (textareaRef.current) textareaRef.current.focus();
      };

      const insertHashtag = (tag) => {
        if (postContent.includes(tag)) return;
        setPostContent(prev => prev ? `${prev} ${tag}` : tag);
        if (textareaRef.current) textareaRef.current.focus();
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);

        const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
        const payload = authMode === 'login' ? { email: authEmail, password: authPassword } : { email: authEmail, password: authPassword, name: authName };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            storage.setUser(data.user);
            setCurrentUser(data.user);
            setAuthModalOpen(false);
            showToast(authMode === 'login' ? `Welcome back, ${data.user.name}!` : 'Account created!');
            setAuthLoading(false);
            return;
          } else if (data.message) {
            throw new Error(data.message);
          }
        } catch(err) {
          // Local fallback
          if (authEmail && authPassword) {
            const user = { email: authEmail, name: authName || authEmail.split('@')[0] };
            storage.setUser(user);
            setCurrentUser(user);
            setAuthModalOpen(false);
            showToast(`Signed in as ${user.name}`);
            setAuthLoading(false);
            return;
          }
          setAuthError('Invalid credentials');
        }
        setAuthLoading(false);
      };

      const handleLogout = () => {
        storage.setUser(null);
        setCurrentUser(null);
        setDrafts([]);
        showToast('Signed out');
      };

      const handleSaveDraft = async () => {
        if (!currentUser) {
          setAuthModalOpen(true);
          showToast('Sign in required to save drafts', 'warning');
          return;
        }
        if (!postContent.trim() && uploadedMedia.length === 0) {
          showToast('Cannot save an empty draft', 'warning');
          return;
        }

        const draftObj = {
          id: editingDraftId || `draft_${Date.now()}`,
          userEmail: currentUser.email,
          title: postTitle.trim() || postContent.slice(0, 40) + '...',
          content: postContent,
          targetPlatforms: selectedPlatforms,
          mediaFiles: uploadedMedia,
          status: 'draft',
          updatedAt: new Date().toISOString()
        };

        try {
          const res = await fetch('/api/drafts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(draftObj)
          });
          if (res.ok) fetchUserDrafts(currentUser.email);
          else setDrafts(storage.saveDraft(draftObj));
        } catch(e) {
          setDrafts(storage.saveDraft(draftObj));
        }

        setEditingDraftId(null);
        showToast(editingDraftId ? 'Draft updated!' : 'Draft saved to Studio!');
      };

      const handlePublishPost = async (draftIdToPublish = null) => {
        if (!currentUser) {
          setAuthModalOpen(true);
          showToast('Sign in required to publish', 'warning');
          return;
        }
        if (!isPostValid && !draftIdToPublish) {
          showToast('Fix platform validation errors first', 'warning');
          return;
        }

        const toPub = draftIdToPublish
          ? drafts.find(d => d.id === draftIdToPublish)
          : {
              id: editingDraftId || `draft_${Date.now()}`,
              userEmail: currentUser.email,
              title: postTitle.trim() || postContent.slice(0, 40) + '...',
              content: postContent,
              targetPlatforms: selectedPlatforms,
              mediaFiles: uploadedMedia
            };

        if (!toPub) return;

        const record = { ...toPub, status: 'published', publishedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };

        try {
          await fetch('/api/drafts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
          });
          fetchUserDrafts(currentUser.email);
        } catch(e) {
          setDrafts(storage.saveDraft(record));
        }

        if (!draftIdToPublish) {
          setPostContent('');
          setPostTitle('');
          setUploadedMedia([]);
          setEditingDraftId(null);
        }
        showToast('Post published successfully across platforms! 🎉');
      };

      const handleEditDraft = (d) => {
        setEditingDraftId(d.id);
        setPostTitle(d.title || '');
        setPostContent(d.content || '');
        setSelectedPlatforms(d.targetPlatforms || ['twitter', 'instagram', 'linkedin', 'facebook']);
        setUploadedMedia(d.mediaFiles || []);
        if (d.targetPlatforms?.[0]) setActivePreviewTab(d.targetPlatforms[0]);
        showToast('Draft loaded into composer');
      };

      const handleDeleteDraft = async (id) => {
        setDrafts(prev => prev.filter(d => String(d.id) !== String(id)));
        if (currentUser?.email) storage.deleteDraft(id, currentUser.email);
        try {
          if (currentUser?.email) {
            await fetch(`/api/drafts?id=${encodeURIComponent(id)}&email=${encodeURIComponent(currentUser.email)}`, { method: 'DELETE' });
            fetchUserDrafts(currentUser.email);
          }
        } catch(e) {}
        showToast('Post removed');
      };

      const clearComposer = () => {
        setPostContent('');
        setPostTitle('');
        setUploadedMedia([]);
        setEditingDraftId(null);
      };

      const renderFormattedText = (text) => {
        if (!text) return <span className="text-slate-400 italic">Start typing your post content...</span>;
        const parts = text.split(/(#[\w\u0590-\u05ff]+)/g);
        return parts.map((part, idx) => {
          if (part.startsWith('#')) {
            return <span key={idx} className="font-semibold text-blue-600 hover:underline">{part}</span>;
          }
          return part;
        });
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans antialiased">
          
          {/* Toast */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 animate-bounce">
              <div className={`px-5 py-3 rounded-2xl shadow-xl border flex items-center gap-3 ${
                toast.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' :
                toast.type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-800' :
                'bg-white border-slate-200 text-slate-900'
              }`}>
                <span className="text-lg">{toast.type === 'error' ? '⚠️' : '✨'}</span>
                <span className="font-medium text-sm">{toast.message}</span>
              </div>
            </div>
          )}

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            
            {/* Header */}
            <header className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-slate-900 flex items-center justify-center border border-slate-800 shadow-xs">
                  <svg className="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2" />
                    <polyline points="2 17 12 22 22 17" />
                    <polyline points="2 12 12 17 22 12" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-2xl font-bold tracking-tight text-slate-900">PostForge</h1>
                  <p className="text-xs text-slate-500 font-medium">Multi-Platform Post Composer & Draft Studio</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {currentUser ? (
                  <div className="flex items-center gap-3 bg-slate-100 p-1.5 pl-4 rounded-full border border-slate-200">
                    <span className="text-xs font-semibold text-slate-800">
                      {formatName(currentUser.name || currentUser.email?.split('@')[0])}
                    </span>
                    <button
                      onClick={handleLogout}
                      className="px-3.5 py-1.5 rounded-full bg-white text-xs font-medium text-slate-700 hover:bg-slate-200 transition shadow-sm"
                    >
                      Sign Out
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                    className="px-5 py-2.5 rounded-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold shadow-md transition"
                  >
                    Sign In / Register
                  </button>
                )}
              </div>
            </header>

            {/* Layout Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              {/* LEFT COLUMN: Composer & Validation (7 cols) */}
              <div className="lg:col-span-7 space-y-6">
                
                {/* Target Platform Selector */}
                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Target Platforms</label>
                    <span className="text-xs font-medium text-slate-500">{selectedPlatforms.length} Selected</span>
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    {Object.values(PLATFORMS).map(platform => {
                      const isSel = selectedPlatforms.includes(platform.id);
                      return (
                        <button
                          key={platform.id}
                          onClick={() => togglePlatform(platform.id)}
                          className={`flex items-center justify-between p-3 rounded-2xl border transition-all text-left ${
                            isSel ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                          }`}
                        >
                          <div className="flex items-center gap-2">
                            {platform.iconSvg ? (
                              <svg className={`w-4 h-4 fill-current ${isSel ? 'text-white' : 'text-slate-700'}`} viewBox="0 0 24 24">
                                <path d={platform.iconSvg} />
                              </svg>
                            ) : (
                              <span className={`w-2 h-2 rounded-full ${isSel ? 'bg-emerald-400' : 'bg-slate-300'}`}></span>
                            )}
                            <span className="text-xs font-semibold">{platform.name}</span>
                          </div>
                          <span className="text-[10px] opacity-75 font-mono">{platform.maxChars}c</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Main Post Composer */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex items-center justify-between">
                    <input
                      type="text"
                      placeholder="Optional Draft Title"
                      value={postTitle}
                      onChange={e => setPostTitle(e.target.value)}
                      className="w-full text-sm font-semibold text-slate-800 placeholder-slate-400 bg-transparent border-b border-slate-100 pb-2 focus:outline-none focus:border-slate-400"
                    />
                    {editingDraftId && (
                      <button onClick={clearComposer} className="text-xs text-rose-500 hover:underline whitespace-nowrap ml-2">
                        Exit Draft Mode
                      </button>
                    )}
                  </div>

                  <textarea
                    ref={textareaRef}
                    rows={6}
                    value={postContent}
                    onChange={e => setPostContent(e.target.value)}
                    placeholder="Compose post content... #hashtags and emojis supported"
                    className="w-full text-sm text-slate-800 placeholder-slate-400 bg-slate-50 p-4 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900/10 transition resize-y font-normal"
                  ></textarea>

                  {/* Emojis & Hashtags */}
                  <div className="space-y-3 pt-2">
                    <div>
                      <label className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 block">Quick Emojis</label>
                      <div className="flex flex-wrap gap-1.5">
                        {EMOJI_LIST.map((emoji, i) => (
                          <button
                            key={i}
                            type="button"
                            onClick={() => insertEmoji(emoji)}
                            className="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm flex items-center justify-center transition"
                          >
                            {emoji}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 block">Trending Hashtags</label>
                      <div className="flex flex-wrap gap-1.5">
                        {TRENDING_HASHTAGS.map((tag, i) => (
                          <button
                            key={i}
                            type="button"
                            onClick={() => insertHashtag(tag)}
                            className="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-medium text-slate-700 transition"
                          >
                            {tag}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Media Uploader */}
                  <div className="pt-2 border-t border-slate-100">
                    <div className="flex items-center justify-between mb-3">
                      <label className="text-xs font-bold uppercase tracking-wider text-slate-400">Media Attachments ({uploadedMedia.length})</label>
                      <label className="cursor-pointer px-3.5 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 flex items-center gap-1.5">
                        <span>➕ Upload Files</span>
                        <input
                          type="file"
                          multiple
                          accept="image/*,video/*,application/pdf"
                          onChange={handleFileUpload}
                          className="hidden"
                        />
                      </label>
                    </div>

                    {uploadedMedia.length > 0 ? (
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        {uploadedMedia.map((m) => (
                          <div key={m.id} className="relative group rounded-2xl overflow-hidden border border-slate-200 bg-slate-100 aspect-video flex items-center justify-center">
                            {m.type === 'image' && <img src={m.url} alt={m.name} className="w-full h-full object-cover" />}
                            {m.type === 'video' && <div className="p-2 text-center text-[10px] font-semibold text-slate-700">📹 {m.name}</div>}
                            {m.type === 'pdf' && <div className="p-2 text-center text-[10px] font-semibold text-slate-700">📄 {m.name}</div>}
                            <button
                              type="button"
                              onClick={() => removeMedia(m.id)}
                              className="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-slate-900/80 text-white flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-xs text-slate-400 italic">No media added yet.</p>
                    )}
                  </div>

                  {/* Actions */}
                  <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                    <button type="button" onClick={clearComposer} className="text-xs font-semibold text-slate-500 hover:text-slate-700">
                      Clear
                    </button>
                    <div className="flex gap-3">
                      <button
                        type="button"
                        onClick={handleSaveDraft}
                        className="px-5 py-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold transition"
                      >
                        {editingDraftId ? 'Update Draft' : 'Save Draft'}
                      </button>
                      <button
                        type="button"
                        onClick={() => handlePublishPost()}
                        disabled={!isPostValid}
                        className={`px-6 py-2.5 rounded-2xl text-xs font-bold transition ${
                          isPostValid
                            ? 'bg-slate-900 hover:bg-slate-800 text-white shadow-md shadow-slate-900/10'
                            : 'bg-slate-100 text-slate-400 cursor-not-allowed shadow-none border border-slate-200/60'
                        }`}
                      >
                        Publish Post
                      </button>
                    </div>
                  </div>
                </div>

                {/* Compliance SVG Rings Panel */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Real-Time Validation Panel</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {selectedPlatforms.map(pKey => {
                      const platform = PLATFORMS[pKey];
                      const val = validations[pKey];
                      const ring = calculateSvgRing(val.percentage, 18);

                      return (
                        <div key={pKey} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className={`p-1.5 rounded-lg flex items-center justify-center ${platform.badgeBg} ${platform.badgeText}`}>
                                <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                                  <path d={platform.iconSvg} />
                                </svg>
                              </span>
                              <span className="text-xs font-bold text-slate-800">{platform.name}</span>
                            </div>

                            <div className="relative w-11 h-11 flex items-center justify-center">
                              <svg className="w-11 h-11 transform -rotate-90" viewBox="0 0 44 44">
                                <circle cx="22" cy="22" r="18" className="stroke-slate-200" strokeWidth="4" fill="transparent" />
                                <circle
                                  cx="22" cy="22" r="18"
                                  className={`transition-all duration-300 ${val.ringBgClass}`}
                                  strokeWidth="4"
                                  strokeDasharray={ring.circumference}
                                  strokeDashoffset={ring.strokeDashoffset}
                                  strokeLinecap="round"
                                  fill="transparent"
                                />
                              </svg>
                              <span className="absolute text-[10px] font-bold text-slate-700">{val.percentage}%</span>
                            </div>
                          </div>

                          <div className="flex justify-between text-[11px] text-slate-500">
                            <span>{val.charCount} / {platform.maxChars} chars</span>
                            <span className={val.remainingChars < 0 ? 'text-rose-500 font-bold' : ''}>{val.remainingChars} left</span>
                          </div>

                          {val.errors.map((err, idx) => (
                            <div key={idx} className="text-[11px] text-rose-600 font-medium flex items-center gap-1">
                              ⚠️ {err}
                            </div>
                          ))}

                          {val.isValid && (
                            <div className="text-[11px] text-emerald-600 font-semibold">✓ Platform Compliant</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* RIGHT COLUMN: Preview & Draft Studio (5 cols) */}
              <div className="lg:col-span-5 space-y-6">
                
                {/* Mockup Preview Card */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Live Mockup Preview</h3>
                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                      {selectedPlatforms.map(pKey => (
                        <button
                          key={pKey}
                          onClick={() => setActivePreviewTab(pKey)}
                          className={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition flex items-center gap-1.5 ${
                            activePreviewTab === pKey ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'
                          }`}
                        >
                          <svg className="w-3 h-3 fill-current" viewBox="0 0 24 24">
                            <path d={PLATFORMS[pKey].iconSvg} />
                          </svg>
                          {PLATFORMS[pKey].name}
                        </button>
                      ))}
                    </div>
                  </div>

                  {(() => {
                    const currentP = PLATFORMS[activePreviewTab] || PLATFORMS.twitter;
                    const authorName = currentUser
                      ? formatName(currentUser.name || currentUser.email.split('@')[0])
                      : currentP.displayName;
                    const authorHandle = currentUser?.email
                      ? `@${currentUser.email.split('@')[0]}`
                      : currentP.handle;

                    return (
                      <div className="border border-slate-200 rounded-2xl bg-white p-4 space-y-3.5 shadow-sm">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <img src={currentP.avatar} alt={authorName} className="w-10 h-10 rounded-full object-cover border border-slate-200" />
                            <div>
                              <div className="flex items-center gap-1">
                                <span className="text-xs font-bold text-slate-900">{authorName}</span>
                                {currentP.verified && <span className="text-blue-500 text-xs">✓</span>}
                              </div>
                              <span className="text-[11px] text-slate-400 font-medium block">{authorHandle} · Just now</span>
                            </div>
                          </div>
                          <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold flex items-center gap-1.5 ${currentP.badgeBg} ${currentP.badgeText}`}>
                            <svg className="w-3 h-3 fill-current" viewBox="0 0 24 24">
                              <path d={currentP.iconSvg} />
                            </svg>
                            {currentP.name}
                          </span>
                        </div>

                        <div className="text-xs sm:text-sm text-slate-800 leading-relaxed whitespace-pre-line break-words [overflow-wrap:anywhere] max-w-full overflow-hidden">
                          {renderFormattedText(postContent)}
                        </div>

                        {uploadedMedia.length > 0 && (
                          <div className={`grid gap-2 rounded-xl overflow-hidden ${uploadedMedia.length === 1 ? 'grid-cols-1' : 'grid-cols-2'}`}>
                            {uploadedMedia.map((m) => (
                              <div key={m.id} className="relative bg-slate-100 rounded-lg border border-slate-200 aspect-video flex items-center justify-center">
                                {m.type === 'image' && <img src={m.url} alt={m.name} className="w-full h-full object-cover" />}
                                {m.type === 'video' && <div className="p-2 text-center text-xs">▶️ {m.name}</div>}
                                {m.type === 'pdf' && <div className="p-2 text-center text-xs">📄 {m.name}</div>}
                              </div>
                            ))}
                          </div>
                        )}

                        <div className="flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-400 px-1">
                          <span>💬 Comment</span>
                          <span>🔄 Share</span>
                          <span>❤️ Like</span>
                        </div>
                      </div>
                    );
                  })()}
                </div>

                {/* Account-Scoped Draft Studio */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Account Studio</h3>
                    {currentUser && (
                      <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                        <button
                          onClick={() => setActiveStudioTab('drafts')}
                          className={`px-3 py-1 rounded-lg text-xs font-bold transition ${activeStudioTab === 'drafts' ? 'bg-white text-slate-900' : 'text-slate-500'}`}
                        >
                          Drafts ({drafts.filter(d => d.status !== 'published').length})
                        </button>
                        <button
                          onClick={() => setActiveStudioTab('published')}
                          className={`px-3 py-1 rounded-lg text-xs font-bold transition ${activeStudioTab === 'published' ? 'bg-white text-slate-900' : 'text-slate-500'}`}
                        >
                          Published ({drafts.filter(d => d.status === 'published').length})
                        </button>
                      </div>
                    )}
                  </div>

                  {!currentUser ? (
                    <div className="py-10 px-4 text-center rounded-2xl bg-slate-50 border border-dashed border-slate-300 space-y-4">
                      <div className="w-12 h-12 rounded-2xl bg-slate-200 text-slate-600 flex items-center justify-center mx-auto text-xl">
                        🔒
                      </div>
                      <div className="space-y-1">
                        <h4 className="text-sm font-bold text-slate-800">Sign In to Access Draft Studio</h4>
                        <p className="text-xs text-slate-500 max-w-xs mx-auto">
                          Saved drafts and published post history are private and account-scoped.
                        </p>
                      </div>
                      <button
                        onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                        className="px-5 py-2.5 rounded-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition"
                      >
                        Sign In Now
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-3 max-h-[420px] overflow-y-auto">
                      {drafts
                        .filter(d => activeStudioTab === 'published' ? d.status === 'published' : d.status !== 'published')
                        .length === 0 ? (
                        <div className="py-8 text-center text-slate-400 text-xs italic bg-slate-50 rounded-2xl border border-slate-200">
                          No {activeStudioTab} found for {currentUser.email}.
                        </div>
                      ) : (
                        drafts
                          .filter(d => activeStudioTab === 'published' ? d.status === 'published' : d.status !== 'published')
                          .map((item) => (
                            <div key={item.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                              <div className="flex justify-between">
                                <h4 className="text-xs font-bold text-slate-900 truncate max-w-[200px]">{item.title || 'Untitled Post'}</h4>
                                <span className="text-[10px] text-slate-400 font-mono">{formatDate(item.updatedAt || item.createdAt)}</span>
                              </div>
                              <p className="text-xs text-slate-600 line-clamp-2 break-words [overflow-wrap:anywhere]">{item.content}</p>

                              {/* Media Attachments Preview */}
                              {item.mediaFiles && item.mediaFiles.length > 0 && (
                                <div className="flex gap-2 py-1 overflow-x-auto">
                                  {item.mediaFiles.map((m, idx) => (
                                    <div key={idx} className="w-12 h-12 rounded-lg bg-slate-200 overflow-hidden shrink-0 border border-slate-300 flex items-center justify-center">
                                      {m.type === 'image' || m.url?.startsWith('data:image') || (typeof m.url === 'string' && m.url.match(/\.(jpeg|jpg|png|gif|webp)/i)) ? (
                                        <img src={m.url} alt={m.name} className="w-full h-full object-cover" />
                                      ) : m.type === 'video' || (m.name && m.name.endsWith('.mp4')) ? (
                                        <span className="text-[10px] font-bold text-slate-700">📹 Video</span>
                                      ) : (
                                        <span className="text-[10px] font-bold text-slate-700">📄 PDF</span>
                                      )}
                                    </div>
                                  ))}
                                </div>
                              )}
                              <div className="flex justify-between pt-2 border-t border-slate-200/60">
                                <div className="flex gap-1">
                                  {(item.targetPlatforms || []).map(p => (
                                    <span key={p} className="px-1.5 py-0.5 rounded text-[9px] font-bold uppercase bg-slate-200 text-slate-700">{p.slice(0,2)}</span>
                                  ))}
                                </div>
                                <div className="flex gap-2">
                                  {activeStudioTab === 'drafts' && (
                                    <>
                                      <button onClick={() => handleEditDraft(item)} className="text-xs font-semibold text-slate-700">Edit</button>
                                      <button onClick={() => handlePublishPost(item.id)} className="text-xs font-bold text-emerald-600">Publish</button>
                                    </>
                                  )}
                                  <button onClick={() => handleDeleteDraft(item.id)} className="text-xs font-medium text-rose-500">Delete</button>
                                </div>
                              </div>
                            </div>
                          ))
                      )}
                    </div>
                  )}
                </div>

              </div>
            </div>
          </div>

          {/* Auth Modal */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-2xl space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-slate-900">{authMode === 'login' ? 'Sign In to PostForge' : 'Create Account'}</h3>
                  <button onClick={() => setAuthModalOpen(false)} className="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-sm font-semibold">✕</button>
                </div>
                {authError && <div className="p-3 rounded-2xl bg-rose-50 border border-rose-200 text-xs font-medium text-rose-700">{authError}</div>}
                <form onSubmit={handleAuthSubmit} className="space-y-4">
                  {authMode === 'register' && (
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Full Name</label>
                      <input type="text" required value={authName} onChange={e => setAuthName(e.target.value)} placeholder="Alex Morgan" className="w-full text-xs p-3 rounded-xl bg-slate-50 border border-slate-200" />
                    </div>
                  )}
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Email Address</label>
                    <input type="email" required value={authEmail} onChange={e => setAuthEmail(e.target.value)} placeholder="alex@postforge.com" className="w-full text-xs p-3 rounded-xl bg-slate-50 border border-slate-200" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Password</label>
                    <input type="password" required value={authPassword} onChange={e => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full text-xs p-3 rounded-xl bg-slate-50 border border-slate-200" />
                  </div>
                  <button type="submit" disabled={authLoading} className="w-full py-3 rounded-2xl bg-slate-900 text-white text-xs font-bold shadow-md">
                    {authLoading ? 'Authenticating...' : (authMode === 'login' ? 'Sign In' : 'Create Account')}
                  </button>
                </form>
                <div className="text-center pt-2 border-t border-slate-100">
                  <button type="button" onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="text-xs font-semibold text-slate-600 hover:underline">
                    {authMode === 'login' ? "Don't have an account? Sign up" : 'Already have an account? Sign in'}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React App to Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
